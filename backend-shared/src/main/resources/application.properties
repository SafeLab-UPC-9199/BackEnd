# Backend-Shared configuration
spring.application.name=backend-shared
server.port=8090

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.test.backend.shared.infrastructure.persistence.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safelab_shared?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}

mqtt.enabled=${MQTT_ENABLED:false}

outbox.dispatch-interval-ms=5000
outbox.max-retries=5
outbox.purge-after-days=7
outbox.purge-cron=0 0 2 * * *
# El outbox es una unica tabla compartida por todos los servicios; sin este
# filtro esta instancia drenaria tambien los eventos de telemetry y los marcaria
# PUBLISHED sin publicarlos en el broker (ADR-005). Cada servicio solo drena el
# tipo de evento que el publica: alerts escribe los INCIDENT_*, telemetry escribe
# TemperatureReadingRecorded y la drena en su propio proceso.
outbox.dispatch-event-types=INCIDENT_CREATED,INCIDENT_ACKNOWLEDGED,INCIDENT_RESOLVED,INCIDENT_ESCALATED

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
