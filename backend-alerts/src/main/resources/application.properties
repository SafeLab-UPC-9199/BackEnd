# Backend-Alerts configuration
spring.application.name=backend-alerts
server.port=8082

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.test.backend.shared.infrastructure.persistence.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safelab_alerts?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=backend-alerts

# Sin configuracion resilience4j: este contexto no realiza llamadas Feign a otros
# servicios (los eventos entrantes llegan por RabbitMQ, no por HTTP), por lo que
# no tiene circuit breaker propio (ADR-004).

# RabbitMQ (ADR-005): consumidor de TemperatureReadingRecorded.
# Los mensajes se declaran en ambos lados (producer y consumer) por lo que no
# hay dependencia de orden de arranque; la topologia es idempotente.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:safelab}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:safelab}

# Reintentos antes de mandar el mensaje a la DLQ: un fallo transitorio (p.ej.
# MySQL reiniciandose) no tira el mensaje a la cola de muertos, pero un mensaje
# corrupto o un fallo persistente tampoco queda requeueado para siempre
# (default-requeue-rejected=false -> x-dead-letter-exchange de la cola).
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=4000
