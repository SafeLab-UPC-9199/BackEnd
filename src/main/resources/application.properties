# Perfil activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=backend

# Configuración de JPA / Hibernate (Se comparte en cualquier perfil)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.test.backend.shared.infrastructure.persistence.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Propiedades compartidas de Base de Datos y MQTT
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Bounded-context schemas (Iteration 0, ADD point 4): create the 8 safelab_* schemas
# BEFORE Hibernate DDL (default ordering runs sql.init first, before hbm2ddl).
# Idempotent. Existing databases with data must run src/main/resources/sql/002-migrate-data.sql once.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/001-create-schemas.sql
mqtt.topic=safelab/#

# MQTT se puede deshabilitar con MQTT_ENABLED=false (se usa en producción hasta tener broker)
mqtt.enabled=${MQTT_ENABLED:true}

# HTTP telemetry ingestion (Iteration 1) — shared key for edge devices, X-Api-Key header
telemetry.ingestion.api-key=${TELEMETRY_INGESTION_API_KEY:}
# Device signature (Iteration 1): hex HMAC-SHA256 of the raw body in X-Signature.
# When set, requests without a valid signature are rejected (fail-closed).
# Per-device signature (firma por dispositivo): if the sensor registered for the
# frame's unit has its own device_secret (provisioned via
# POST /api/v1/sensor-configurations/{id}/device-secret), THAT key is required
# instead of this shared one.
telemetry.ingestion.hmac-secret=${TELEMETRY_INGESTION_HMAC_SECRET:}

# MQTT mutual TLS (Iteration 1, QAS-01): X.509 client certificate + pinned trust store.
# Empty key-store/trust-store keeps plain JVM-default TLS (no client certificate).
mqtt.ssl.key-store=${MQTT_SSL_KEY_STORE:}
mqtt.ssl.key-store-password=${MQTT_SSL_KEY_STORE_PASSWORD:}
mqtt.ssl.key-store-type=${MQTT_SSL_KEY_STORE_TYPE:PKCS12}
mqtt.ssl.trust-store=${MQTT_SSL_TRUST_STORE:}
mqtt.ssl.trust-store-password=${MQTT_SSL_TRUST_STORE_PASSWORD:}
mqtt.ssl.trust-store-type=${MQTT_SSL_TRUST_STORE_TYPE:JKS}

# Resilience4j — outbound email (Resend) external dependency
resilience4j.circuitbreaker.instances.resend.register-health-indicator=true
resilience4j.circuitbreaker.instances.resend.sliding-window-size=10
resilience4j.circuitbreaker.instances.resend.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.resend.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.resend.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.resend.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.retry.instances.resend.max-attempts=3
resilience4j.retry.instances.resend.wait-duration=1s

# Resend Email Configuration
resend.api-key=${RESEND_API_KEY:}

# JWT Configuration
authorization.jwt.expiration.days=50

# CORS Configuration
cors.allowed-origins=http://localhost:4200,https://*.vercel.app

server.port=${PORT:8080}

# Custom Swagger UI path
springdoc.swagger-ui.path=/swagger/index.html

# Outbox (Iteration 0)
outbox.dispatch-interval-ms=5000
outbox.max-retries=5
outbox.purge-after-days=7
outbox.purge-cron=0 0 2 * * *

# Telemetry idempotency
telemetry.idempotency.ttl-minutes=60

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries
management.endpoint.health.show-details=when-authorized
