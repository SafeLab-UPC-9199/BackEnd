# Perfil activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=backend

# Configuración de JPA / Hibernate (Se comparte en cualquier perfil)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.test.backend.shared.infrastructure.persistence.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Propiedades compartidas de Base de Datos y MQTT
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mqtt.topic=safelab/#

# MQTT se puede deshabilitar con MQTT_ENABLED=false (se usa en producción hasta tener broker)
mqtt.enabled=${MQTT_ENABLED:true}

# HTTP telemetry ingestion (Iteration 1) — shared key for edge devices, X-Api-Key header
telemetry.ingestion.api-key=${TELEMETRY_INGESTION_API_KEY:}

# JWT Configuration
authorization.jwt.expiration.days=50

# CORS Configuration
cors.allowed-origins=http://localhost:4200,https://*.vercel.app

server.port=${PORT:8080}

# Custom Swagger UI path
springdoc.swagger-ui.path=/swagger/index.html

# Outbox (Iteration 0)
outbox.dispatch-interval-ms=5000
outbox.max-retries=5
outbox.purge-after-days=7
outbox.purge-cron=0 0 2 * * *

# Telemetry idempotency
telemetry.idempotency.ttl-minutes=60

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
