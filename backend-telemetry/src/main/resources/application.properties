# Backend-Telemetry configuration
spring.application.name=backend-telemetry
server.port=8081

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.test.backend.shared.infrastructure.persistence.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safelab_telemetry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}

mqtt.enabled=${MQTT_ENABLED:true}
mqtt.topic=safelab/#

telemetry.ingestion.api-key=${TELEMETRY_INGESTION_API_KEY:}
telemetry.ingestion.hmac-secret=${TELEMETRY_INGESTION_HMAC_SECRET:}
telemetry.idempotency.ttl-minutes=60

# Automation service (sensor registry) reached via Feign from the ingestion pipeline.
# In docker-compose the hostname is the service name; outside it, override with
# AUTOMATION_SERVICE_URL=http://localhost:8086
automation.service.url=${AUTOMATION_SERVICE_URL:http://safelab-backend-automation:8086}

# RabbitMQ (ADR-005): telemetry es el unico publicador de
# TemperatureReadingRecorded y drena del outbox solo ese tipo de evento (el
# servicio backend-shared drena los INCIDENT_*); de lo contrario ambos
# despachadores competirian por la misma fila de la tabla compartida.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:safelab}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:safelab}
outbox.dispatch-event-types=TemperatureReadingRecorded
outbox.dispatch-interval-ms=5000
outbox.max-retries=5
outbox.purge-after-days=7
outbox.purge-cron=0 0 2 * * *

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=backend-telemetry

# Resilience4j - Circuit Breaker para llamadas entre servicios (ADR-004)
resilience4j.circuitbreaker.instances.labs-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.labs-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.labs-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.labs-service.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.labs-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.labs-service.automaticTransitionFromOpenToHalfOpenEnabled=true
# Client errors (unregistered unit / malformed payload) are neither success nor
# failure: a burst of bad requests must not open the circuit against automation.
resilience4j.circuitbreaker.instances.labs-service.ignoreExceptions=java.lang.IllegalArgumentException,java.lang.IllegalStateException

resilience4j.retry.instances.labs-service.maxAttempts=3
resilience4j.retry.instances.labs-service.waitDuration=1s
resilience4j.retry.instances.labs-service.ignoreExceptions=java.lang.IllegalArgumentException,java.lang.IllegalStateException

resilience4j.ratelimiter.instances.telemetry-ingestion.limitForPeriod=60
resilience4j.ratelimiter.instances.telemetry-ingestion.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.telemetry-ingestion.timeoutDuration=0s
