spring.cloud.gateway.server.webflux.routes[14].predicates=Path=/api/v1/user-profiles/**

spring.cloud.gateway.server.webflux.routes[15].id=sensor-configurations-route
spring.cloud.gateway.server.webflux.routes[15].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[15].predicates=Path=/api/v1/sensor-configurations/**

spring.cloud.gateway.server.webflux.routes[16].id=security-accesses-route
spring.cloud.gateway.server.webflux.routes[16].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[16].predicates=Path=/api/v1/security-accesses/**

spring.cloud.gateway.server.webflux.routes[17].id=role-definitions-route
spring.cloud.gateway.server.webflux.routes[17].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[17].predicates=Path=/api/v1/role-definitions/**

spring.cloud.gateway.server.webflux.routes[18].id=pending-invitations-route
spring.cloud.gateway.server.webflux.routes[18].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[18].predicates=Path=/api/v1/pending-invitations/**

spring.cloud.gateway.server.webflux.routes[19].id=notification-preferences-route
spring.cloud.gateway.server.webflux.routes[19].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[19].predicates=Path=/api/v1/notification-preferences/**

spring.cloud.gateway.server.webflux.routes[20].id=lab-users-route
spring.cloud.gateway.server.webflux.routes[20].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[20].predicates=Path=/api/v1/lab-users/**

spring.cloud.gateway.server.webflux.routes[21].id=general-settings-route
spring.cloud.gateway.server.webflux.routes[21].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[21].predicates=Path=/api/v1/general-settings/**

spring.cloud.gateway.server.webflux.routes[22].id=equipment-thresholds-route
spring.cloud.gateway.server.webflux.routes[22].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[22].predicates=Path=/api/v1/equipment-thresholds/**

spring.cloud.gateway.server.webflux.routes[23].id=automation-rules-route
spring.cloud.gateway.server.webflux.routes[23].uri=http://safelab-backend-automation:8086
spring.cloud.gateway.server.webflux.routes[23].predicates=Path=/api/v1/automation-rules/**

# CORS configuration (new 5.x prefix; legacy prefix kept as fallback)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/api/v1/**].allowed-origins=http://localhost:4200,https://*.vercel.app
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/api/v1/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/api/v1/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/api/v1/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allowed-origins=http://localhost:4200,https://*.vercel.app
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allow-credentials=true

# Actuator
# Boot 4: access is opt-in per endpoint; @RestControllerEndpoint(gateway) declares
# defaultAccess=NONE, so without the access property the bean is REMOVED from the
# context and /actuator/gateway returns 404. There is no "routes" endpoint id in
# Gateway 5.x (both beans are id "gateway"; the legacy one surfaces /routes/* ops).
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted

# --- Edge security (Fase 6, ADR-006) ---------------------------------------
# The gateway validates the Bearer JWT locally with the SAME secret and HS256
# algorithm backend-iam uses to sign it (backend-iam reads JWT_SECRET too), so
# authentication does not add a hop to iam on every request. See
# JwtAuthenticationGlobalFilter.
authorization.jwt.secret=${JWT_SECRET:SafeLabSecretKeyForJwtTokenGeneration2026SecureKey32BytesLong!}
