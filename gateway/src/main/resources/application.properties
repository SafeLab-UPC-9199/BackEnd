# Gateway configuration
spring.application.name=gateway
server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Cloud Gateway routes - static routes to microservices
spring.cloud.gateway.discovery.enabled=false

# Service URLs (Docker service names work in docker-compose; localhost for local dev)
spring.cloud.gateway.routes[0].id=telemetry-route
spring.cloud.gateway.routes[0].uri=http://backend-telemetry:8081
spring.cloud.gateway.routes[0].predicates=Path=/api/v1/telemetry/**

spring.cloud.gateway.routes[1].id=alerts-route
spring.cloud.gateway.routes[1].uri=http://backend-alerts:8082
spring.cloud.gateway.routes[1].predicates=Path=/api/v1/alerts/**

spring.cloud.gateway.routes[2].id=labs-route
spring.cloud.gateway.routes[2].uri=http://backend-labs:8083
spring.cloud.gateway.routes[2].predicates=Path=/api/v1/laboratories/**

spring.cloud.gateway.routes[3].id=iam-route
spring.cloud.gateway.routes[3].uri=http://backend-iam:8084
spring.cloud.gateway.routes[3].predicates=Path=/api/v1/auth/**,Path=/api/v1/users/**,Path=/api/v1/profile/**

spring.cloud.gateway.routes[4].id=compliance-route
spring.cloud.gateway.routes[4].uri=http://backend-compliance:8085
spring.cloud.gateway.routes[4].predicates=Path=/api/v1/compliance/**

spring.cloud.gateway.routes[5].id=automation-route
spring.cloud.gateway.routes[5].uri=http://backend-automation:8086
spring.cloud.gateway.routes[5].predicates=Path=/api/v1/automation/**

spring.cloud.gateway.routes[6].id=history-route
spring.cloud.gateway.routes[6].uri=http://backend-history:8087
spring.cloud.gateway.routes[6].predicates=Path=/api/v1/history/**

spring.cloud.gateway.routes[7].id=shared-route
spring.cloud.gateway.routes[7].uri=http://backend-shared:8090
spring.cloud.gateway.routes[7].predicates=Path=/api/v1/system/**

# CORS configuration
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allowed-origins=http://localhost:4200,https://*.vercel.app
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations[/api/v1/**].allow-credentials=true

# Actuator
management.endpoints.web.exposure.include=health,info,routes,gateway
