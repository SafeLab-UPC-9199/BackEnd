# Gateway configuration
spring.application.name=gateway
server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Cloud Gateway 5.x (train 2025.1.x) moved its properties under
# spring.cloud.gateway.server.webflux.* — the legacy spring.cloud.gateway.routes
# prefix is silently ignored and the gateway starts with ZERO routes (404 on
# every request). Both prefixes are kept below where applicable.
spring.cloud.gateway.server.webflux.discovery.enabled=false
spring.cloud.gateway.discovery.enabled=false

# --- Routes -------------------------------------------------------------
# ONE Path predicate per route: multiple predicates on a route are ANDed, so a
# single route with several Path predicates would never match. Actual
# controller base paths are taken from each module's @RequestMapping.
#
# compliance-lab-reports MUST come before labs: its URL also starts with
# /api/v1/laboratories/... and routes are evaluated in index order.

# [0] compliance: /api/v1/laboratories/{id}/compliance-reports (before labs!)
spring.cloud.gateway.server.webflux.routes[0].id=compliance-lab-reports-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://safelab-backend-compliance:8085
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/api/v1/laboratories/{laboratoryId}/compliance-reports/**

# [1] labs
spring.cloud.gateway.server.webflux.routes[1].id=labs-route
spring.cloud.gateway.server.webflux.routes[1].uri=http://safelab-backend-labs:8083
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/api/v1/laboratories/**

# [2] telemetry: readings + stats + ingestion
spring.cloud.gateway.server.webflux.routes[2].id=telemetry-route
spring.cloud.gateway.server.webflux.routes[2].uri=http://safelab-backend-telemetry:8081
spring.cloud.gateway.server.webflux.routes[2].predicates=Path=/api/v1/telemetry/**

# [3] telemetry: metric-types live in the telemetry catalog
spring.cloud.gateway.server.webflux.routes[3].id=metric-types-route
spring.cloud.gateway.server.webflux.routes[3].uri=http://safelab-backend-telemetry:8081
spring.cloud.gateway.server.webflux.routes[3].predicates=Path=/api/v1/metric-types/**

# [4] alerts (incl. /alerts/outbox)
spring.cloud.gateway.server.webflux.routes[4].id=alerts-route
spring.cloud.gateway.server.webflux.routes[4].uri=http://safelab-backend-alerts:8082
spring.cloud.gateway.server.webflux.routes[4].predicates=Path=/api/v1/alerts/**

# [5] alerts: incidents
spring.cloud.gateway.server.webflux.routes[5].id=incidents-route
spring.cloud.gateway.server.webflux.routes[5].uri=http://safelab-backend-alerts:8082
spring.cloud.gateway.server.webflux.routes[5].predicates=Path=/api/v1/incidents/**

# [6] iam: authentication (the controller maps /api/v1/authentication, not /auth)
spring.cloud.gateway.server.webflux.routes[6].id=authentication-route
spring.cloud.gateway.server.webflux.routes[6].uri=http://safelab-backend-iam:8084
spring.cloud.gateway.server.webflux.routes[6].predicates=Path=/api/v1/authentication/**

# [7] iam: legacy /auth alias (kept for older clients)
spring.cloud.gateway.server.webflux.routes[7].id=auth-legacy-route
spring.cloud.gateway.server.webflux.routes[7].uri=http://safelab-backend-iam:8084
spring.cloud.gateway.server.webflux.routes[7].predicates=Path=/api/v1/auth/**

# [8] iam: users
spring.cloud.gateway.server.webflux.routes[8].id=users-route
spring.cloud.gateway.server.webflux.routes[8].uri=http://safelab-backend-iam:8084
spring.cloud.gateway.server.webflux.routes[8].predicates=Path=/api/v1/users/**

# [9] iam: profile alias
spring.cloud.gateway.server.webflux.routes[9].id=profile-route
spring.cloud.gateway.server.webflux.routes[9].uri=http://safelab-backend-iam:8084
spring.cloud.gateway.server.webflux.routes[9].predicates=Path=/api/v1/profile/**

# [10] compliance: audit trails
spring.cloud.gateway.server.webflux.routes[10].id=audit-trails-route
spring.cloud.gateway.server.webflux.routes[10].uri=http://safelab-backend-compliance:8085
spring.cloud.gateway.server.webflux.routes[10].predicates=Path=/api/v1/audit-trails/**

# [11] history (controller maps /api/v1/history-records, not /history)
spring.cloud.gateway.server.webflux.routes[11].id=history-records-route
spring.cloud.gateway.server.webflux.routes[11].uri=http://safelab-backend-history:8087
spring.cloud.gateway.server.webflux.routes[11].predicates=Path=/api/v1/history-records/**

# [12] shared: system status
spring.cloud.gateway.server.webflux.routes[12].id=system-route
spring.cloud.gateway.server.webflux.routes[12].uri=http://safelab-backend-shared:8090
spring.cloud.gateway.server.webflux.routes[12].predicates=Path=/api/v1/system/**

# [13..23] automation (11 controllers, none uses an /automation prefix)
