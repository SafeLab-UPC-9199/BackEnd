# SafeLab: broker MQTT local para la ingesta MQTT de backend-telemetry.
# Anonimo y sin TLS, pensado para la red docker interna del proyecto; el
# cliente usa mqtt.protocol=tcp por defecto (TLS/mTLS documentado en QAS-01
# queda para despliegues expuestos).
listener 1883
allow_anonymous true
persistence false
log_dest stdout
