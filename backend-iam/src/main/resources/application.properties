# Backend-IAM configuration
spring.application.name=backend-iam
server.port=8084

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.test.backend.shared.infrastructure.persistence.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safelab_iam?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}

authorization.jwt.expiration.days=50
authorization.jwt.secret=${JWT_SECRET:SafeLabSecretKeyForJwtTokenGeneration2026SecureKey32BytesLong!}

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=backend-iam

# Resilience4j - Circuit Breaker para el cliente de email saliente Resend
# (ADR-004; misma parametrizacion que el monolito)
resilience4j.circuitbreaker.instances.resend.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.resend.slidingWindowSize=10
resilience4j.circuitbreaker.instances.resend.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resend.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.resend.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.resend.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.retry.instances.resend.maxAttempts=3
resilience4j.retry.instances.resend.waitDuration=1s

# Resend Email Configuration (same default as the monolith; without it the
# ResendClient @Value("${resend.api-key}") fails at bean creation)
resend.api-key=${RESEND_API_KEY:}
